# cargo-deny policy, run by `scripts/check.sh deps` (advisories, licenses,
# bans, sources). Validated with the cargo-deny version pinned in
# scripts/install-tools.sh, which stays the only place that version is written.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Only the licenses the crate graph actually uses: unused allowances only warn
# (license-not-encountered), so later phases extend this list as each crate
# arrives, not ahead of it.
# Apache-2.0: unicode-bom (and dunce, offered CC0-1.0 OR MIT-0 OR Apache-2.0).
# Unicode-3.0: unicode-ident and unicode-normalization.
# Zlib: foldhash and zlib-rs.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# cargo-deny 0.20.2 license-checks only normal dependencies by default; without
# this line the gate never saw tempfile or its transitive crates (verified
# 2026-10-26).
include-dev = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

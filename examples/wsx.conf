# wsx manifest -- annotated template.
#
# Lives at the repo root on your `personal-workspace` branch. Copy this file
# there, trim it to the paths you actually keep, and run `wsx setup`.
#
# Format: one "<policy> <path>" entry per line, paths relative to the repo root.
# The longest matching entry wins, so a nested entry overrides its parent --
# that is how you carve an unmergeable file out of an otherwise synced tree.
#
#   sync   three-way sync. Detects which side changed since the last sync and
#          applies it; if both changed, reports a conflict and clobbers
#          nothing. The default, and correct for text.
#   pull   one-way, source -> worktree. Local edits are overwritten on the next
#          pull and never pushed back. For read-only reference content.
#   lww    last writer wins by mtime; the overwritten copy is saved under
#          <git-dir>/wsx/backups/. For binary or runtime state that cannot be
#          merged -- SQLite databases, append-only logs.
#   skip   excluded entirely.
#
# Every path listed here is ignored and guarded in dev worktrees, so it can be
# edited freely there and can never be committed to a shared branch. Only the
# `personal-workspace` branch commits them.

# ---- agent guidance -------------------------------------------------------
# Nested per-directory agent files are common in monorepos; list each one.
sync  AGENTS.md
sync  CLAUDE.md
sync  services/api/CLAUDE.md
sync  web/src/CLAUDE.md
sync  web/src/hooks/CLAUDE.md

# ---- planning / notes -----------------------------------------------------
sync  .planning

# ---- tooling state --------------------------------------------------------
# Per-project agent hooks. Keep these worktree-portable: derive the repo root
# at runtime rather than hard-coding a path, or a copy in another worktree will
# operate on the wrong tree.
sync  .github

# Workflow tooling state. Mostly markdown, so sync it...
sync  .mytool

# ...but carve out the parts that cannot be merged. These entries are longer
# than `sync .mytool` above, so they win for the paths they name. A three-way
# merge of a SQLite file corrupts it, and append-only logs would interleave.
lww   .mytool/state.db
lww   .mytool/audit
lww   .mytool/runtime

# Vendored reference material: mirror it in, never sync local edits back out.
pull  .agents

# ---- not present yet ------------------------------------------------------
# Listing a path before it exists means it is ignored and synced the moment it
# appears, instead of showing up as an untracked surprise later.
sync  .mcp.json
